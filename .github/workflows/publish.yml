# Publishes alguna to PyPI when a merge to main changes the version in
# pyproject.toml, then tags the commit v<version>. A version that already has
# its tag is skipped, so other merges publish nothing.
# PyPI trusted publishing (OIDC) binds the project to this repo and this file:
# no PyPI token is stored. Before the first release, add a pending publisher
# for `alguna` on pypi.org.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, so two merges cannot publish the same version twice.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    # Releases come from main only, also when the workflow is started by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read the version and look for its tag
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          # --exit-code: 0 when the tag exists, 2 when it does not, other codes on errors.
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already tagged, so it is already published. Nothing to do."
            echo "publish=false" >>"$GITHUB_OUTPUT"
          else
            status=$?
            if [ "${status}" != 2 ]; then exit "${status}"; fi
            echo "publish=true" >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1
          python -m build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # A separate job, so only the upload step can get an OIDC token, not the build.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Tags the released commit last: the tag records that the version is published.
  # The workflow token pushes it, so it does not start another workflow run.
  # If only this job fails, use "Re-run failed jobs": a full re-run finds no tag
  # and uploads the version again, which the registry refuses.
  tag:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Push the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "v${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/v${VERSION}"
