[project]
name = "alguna"
version = "0.1.0"
description = "Python SDK for the Alguna billing API"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Alguna", email = "support@alguna.io" }]
keywords = ["alguna", "billing", "invoicing", "subscriptions", "usage-based-billing", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.26.0",
  "pydantic>=2.6",
  "typing_extensions>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/alguna-io/alguna-python"
Repository = "https://github.com/alguna-io/alguna-python"
Documentation = "https://alguna.com/docs"

[project.optional-dependencies]
aiohttp = ["httpx-aiohttp>=0.1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alguna"]
exclude = ["src/alguna/tests"]

[tool.hatch.build.targets.sdist]
include = ["src/alguna"]
exclude = ["src/alguna/tests"]
